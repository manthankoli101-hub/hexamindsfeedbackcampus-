<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusFeedback — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="brand-mark">CP</div>
      <p class="eyebrow">CAMPUS SERVICE FEEDBACK</p>
      <h1>CampusFeedback</h1>
      <p class="muted">Turn campus feedback into actionable issues.</p>

      <form id="loginForm" class="form">
        <label for="email">College email</label>
        <input id="email" type="email" value="student@gsmcoe.ac.in" placeholder="you@college.edu" required>

        <button class="btn btn-primary" type="submit">Sign in</button>
        <p id="loginError" class="form-error"></p>
      </form>

      <div class="demo-card">
        <strong>Demo accounts</strong>
        <span>Student: student@gsmcoe.ac.in</span>
        <span>Admin: admin@gsmcoe.ac.in</span>
      </div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
